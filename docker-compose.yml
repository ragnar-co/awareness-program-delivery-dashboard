services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DASHBOARD_DB_PATH: /app/data/awareness.db
      # DASHBOARD_CSV_PATH auto-seeds on first boot ONLY if the file is actually
      # reachable inside the container. Setting it on the host does nothing by
      # itself — see the optional bind mount below, or just POST /api/ingest
      # once after `docker compose up -d` (works with zero extra config, see
      # DEPLOYMENT.md "Loading data"). Left unset by default for that reason.
      DASHBOARD_CSV_PATH: ${DASHBOARD_CSV_PATH:-}
      DASHBOARD_AS_OF: ${DASHBOARD_AS_OF:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - dashboard-data:/app/data
      # Optional: uncomment to auto-seed on first boot, and set
      # DASHBOARD_CSV_PATH=/app/data/seed.csv above to match.
      # - ${CSV_HOST_PATH}:/app/data/seed.csv:ro

volumes:
  dashboard-data:
