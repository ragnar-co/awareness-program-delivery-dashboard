services:
  dashboard:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      DASHBOARD_DB_PATH: /app/data/awareness.db
      DASHBOARD_CSV_PATH: ${DASHBOARD_CSV_PATH:-}
      DASHBOARD_AS_OF: ${DASHBOARD_AS_OF:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - dashboard-data:/app/data

volumes:
  dashboard-data:
